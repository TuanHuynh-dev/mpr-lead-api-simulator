<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>MPR Lead API Simulator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f5f7; margin: 0; padding: 40px 16px; color: #222; }
        .wrap { max-width: 720px; margin: 0 auto; }
        h1 { font-size: 24px; margin: 0 0 8px; }
        p { color: #555; margin: 0 0 24px; }
        a.card { display: block; background: #fff; border: 1px solid #ddd; border-left: 4px solid #c8102e; border-radius: 6px;
                 padding: 16px 20px; margin-bottom: 12px; text-decoration: none; color: inherit; }
        a.card:hover { border-color: #c8102e; }
        .name { font-weight: bold; font-size: 16px; }
        .api { font-family: monospace; font-size: 13px; color: #666; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>MPR Lead API Simulator</h1>
        <p>Trang mô phỏng gửi Lead vào Salesforce qua Apex REST, dùng để test luồng Lead trùng (ticket 5870). Org: IVC-Partial.</p>

        <a class="card" href="website/">
            <div class="name">Website IVC</div>
            <div class="api">APILeadIVCWebsite</div>
        </a>
        <a class="card" href="landing-page/">
            <div class="name">Landing Page</div>
            <div class="api">APILeadLandingpage</div>
        </a>
        <a class="card" href="lead-campaign/">
            <div class="name">Lead Campaign (Sự kiện)</div>
            <div class="api">APILeadCampaignWebsite</div>
        </a>
        <a class="card" href="test-drive/">
            <div class="name">Đăng ký lái thử (Test Drive)</div>
            <div class="api">APINewTestDrive</div>
        </a>
    </div>
</body>
</html>
