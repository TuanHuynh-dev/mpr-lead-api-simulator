<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Mua Xe - Isuzu Quang Trung</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --isuzu-red: #ed1c24;
            --isuzu-dark: #0f0f0f;
            --gray-bg: #f4f4f4;
            --white: #ffffff;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            /* Background ảnh xe mờ ảo phía sau */
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8)),
                url('https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&q=80&w=2070');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.98);
            width: 100%;
            max-width: 550px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow);
            position: relative;
        }

        /* Header của Card */
        .card-header {
            background: var(--isuzu-dark);
            color: var(--white);
            padding: 35px 40px;
            text-align: center;
            border-bottom: 4px solid var(--isuzu-red);
        }

        .card-header h1 {
            font-weight: 800;
            letter-spacing: -1px;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .card-header h1 span {
            color: var(--isuzu-red);
        }

        .card-header p {
            font-size: 14px;
            opacity: 0.8;
            font-weight: 300;
        }

        /* Form area */
        .form-body {
            padding: 40px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--isuzu-dark);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #eee;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 700;
            color: #666;
            margin-bottom: 8px;
            margin-left: 2px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fdfdfd;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--isuzu-red);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(237, 28, 36, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 18px;
            background: var(--isuzu-red);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s, background 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #d11920;
            transform: translateY(-2px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .footer-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            min-height: 20px;
        }

        .success {
            color: #10b981;
            font-weight: 600;
        }

        .error {
            color: #ef4444;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .form-body {
                padding: 25px;
            }

            .card-header {
                padding: 25px;
            }
        }
    </style>
</head>

    <script>
        // GIỮ NGUYÊN LOGIC CỦA BẠN
        function getUTMParams() {
            const params = new URLSearchParams(window.location.search);
            const utmFields = ['utm_campaign', 'utm_source', 'utm_medium'];
            utmFields.forEach(field => {
                const value = params.get(field);
                if (!value) return;
                const el = document.getElementById(field);
                if (el.tagName === 'SELECT' && !Array.from(el.options).some(o => o.value === value)) {
                    el.add(new Option(value, value));
                }
                el.value = value;
            });
        }

        window.onload = getUTMParams;
        document.getElementById('leadForm').addEventListener('input', function () {
            // Khi người dùng gõ bất cứ thứ gì, xóa thông báo thành công đi
            document.getElementById('message').innerHTML = "";
        });

        let isSubmitting = false; // Chống double-click / Enter gửi trùng
        document.getElementById('leadForm').addEventListener('submit', function (event) {
            event.preventDefault();
            if (isSubmitting) return;
            isSubmitting = true;
            const btn = document.getElementById('submitBtn');
            const msgDiv = document.getElementById('message');
            btn.disabled = true;
            btn.innerText = "Đang gửi...";

            const formData = {
                lastName: document.getElementById('lastName').value,
                firstName: document.getElementById('firstName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                zaloNumber: document.getElementById('zaloNumber').value,
                company: document.getElementById('company').value,
                country: document.getElementById('country').value,
                requestDate: new Date().toISOString(),
                province: document.getElementById('province').value,
                dealerCode: document.getElementById('dealership').value,
                carModel: document.getElementById('carModel').value,
                utmCampaign: document.getElementById('utm_campaign').value,
                utmSource: document.getElementById('utm_source').value,
                utmMedium: document.getElementById('utm_medium').value
            };

            const salesforceEndpoint = 'https://ivcl--partial.sandbox.my.salesforce-sites.com/api/services/apexrest/APILeadCampaignWebsite';

            fetch(salesforceEndpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            })
                .then(response => response.json())
                .then(data => {
                    if (data && (data.Code === 200 || data.status === 'success')) {
                        msgDiv.innerHTML = "<span class='success'>✓ Chúc mừng! Đăng ký thành công.</span>";
                        document.getElementById('leadForm').reset();
                    } else {
                        msgDiv.innerHTML = "<span class='error'>Lỗi: " + (data.Message || "Vui lòng thử lại") + "</span>";
                    }
                })
                .catch(error => {
                    msgDiv.innerHTML = "<span class='error'>Lỗi kết nối mạng.</span>";
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.innerText = "Gửi Yêu Cầu Ngay";
                    isSubmitting = false;
                });
        });
    </script>
